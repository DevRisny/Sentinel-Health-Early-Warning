[project]
name = "sentinel-health-early-warning"
version = "1.0.0"
description = "Explainable 48-hour early warning for heat and dust health risk in outdoor and industrial workforces"
authors = [{ name = "Risny Suha" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::RuntimeWarning", "ignore::FutureWarning", "ignore::DeprecationWarning"]
